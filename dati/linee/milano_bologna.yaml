# Linea storica Milano Centrale - Bologna Centrale (via Lodi, Piacenza, Parma).
#
# Campi di ogni stazione:
#   id       identificativo breve, usato internamente
#   nome     nome mostrato sul quadro sinottico
#   nome_vt  nome come compare su ViaggiaTreno (serve per trovare il codice)
#   km       progressiva chilometrica (approssimata) da Milano Centrale
#   binari   binari disegnati sul quadro; un treno su un binario non elencato
#            viene disegnato sul binario di corsa della sua direzione
#   codice   (facoltativo) codice ViaggiaTreno; se manca viene cercato in automatico

id: milano_bologna
nome: Milano Centrale – Bologna Centrale
descrizione: Linea storica via Lodi, Piacenza, Parma, Reggio Emilia, Modena
verso_crescente: verso Bologna
verso_decrescente: verso Milano
# Due fermate più lontane di così non sono considerate un tratto di questa linea
# (esclude ad esempio le Frecce che corrono sulla linea Alta Velocità).
max_salto_km: 80

stazioni:
