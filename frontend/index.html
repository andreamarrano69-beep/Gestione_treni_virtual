<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quadro Sinottico</title>
  <meta name="theme-color" content="#04070b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icone/icona-192.png">
  <link rel="apple-touch-icon" href="icone/icona-192.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/testata.css">
  <link rel="stylesheet" href="css/sinottico.css">
  <link rel="stylesheet" href="css/pannelli.css">
  <link rel="stylesheet" href="css/comandi.css">
  <link rel="stylesheet" href="css/finestra.css">
</head>
<body>
  <header class="testata">
    <div class="testata__linea">
      <span class="testata__marchio">DCO</span>
      <div>
        <h1 id="nome-linea">Caricamento linea…</h1>
        <p id="descrizione-linea"></p>
      </div>
    </div>
    <div class="orologio" id="orologio">--:--:--</div>
    <div class="stato-fonte" id="stato-fonte"></div>
  </header>

  <main>
    <nav class="comandi" aria-label="Comandi">
      <div class="filtro" id="filtro-categorie"></div>
      <div class="comandi__azioni">
        <button type="button" class="pulsante" id="installa-app" hidden>📲 Installa app</button>
        <button type="button" class="pulsante" id="apri-scelta-linea">⇆ Scegli linea…</button>
      </div>
    </nav>
    <p class="avviso" id="avviso-installazione" hidden></p>

    <section class="quadro" aria-label="Quadro sinottico della linea">
      <svg id="sinottico" role="img"></svg>
      <ul class="legenda" id="legenda"></ul>
    </section>

    <section class="pannelli">
      <article class="pannello pannello--largo">
        <h2>Treni in linea <span class="contatore" id="contatore-treni"></span></h2>
        <div class="scorrevole"><table class="tabella" id="tabella-treni"></table></div>
      </article>
      <article class="pannello">
        <h2>Prossimi incroci e precedenze</h2>
        <div class="scorrevole"><ol class="lista-incroci" id="lista-incroci"></ol></div>
      </article>
      <article class="pannello">
        <h2>Dettaglio treno</h2>
        <div class="scorrevole" id="dettaglio-treno">
          <p class="vuoto">Seleziona un treno sul quadro o nell'elenco.</p>
        </div>
      </article>
    </section>
  </main>

  <dialog class="finestra" id="finestra-linea" aria-labelledby="titolo-finestra-linea"></dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
